<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection — Lumen</title>

<!-- Browsers largely ignore these; the real protection is the Cache-Control
     headers in _headers / netlify.toml / vercel.json. Kept as a second line. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="assets/styles.css">

<!-- ══════════════════════════════════════════════════════════════════════════
     INSIDER WEB SDK
     Order is load-bearing:
       1. InsiderQueue array
       2. site scripts (telemetry wrapper must precede the first push)
       3. Insider Tag (ins.js)
       4. user data -> page data -> init
     ═══════════════════════════════════════════════════════════════════════ -->

<!-- 1. The queue. Must exist before the tag loads. -->
<script>window.InsiderQueue = window.InsiderQueue || [];</script>

<!-- 2. Site scripts. insider-debug.js wraps InsiderQueue.push to mirror every
        payload into the on-page console, so it loads before anything is sent. -->
<script src="assets/config.js"></script>
<script src="assets/insider-debug.js"></script>
<script src="assets/vertical.js"></script>
<script src="assets/store.js"></script>
<script src="assets/explain.js"></script>
<script src="assets/affinity.js"></script>
<script src="assets/agent.js"></script>

<!-- 3. Insider Tag — written by assets/vertical.js, because which
        account it points at depends on the hostname:
          beauty.insiderdemo.com          -> partnersandbox
          beauty-sandbox.insiderdemo.com  -> partnersandbox
        Account and partner id are listed in vertical.js and shown
        live in the SDK console. -->

<!-- 4. Data pushes for this page. -->
<script src="assets/eureka.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  var COLLECTION = params.get('c') || 'Makeup';
  var SUBCAT = params.get('sub') || null;

  Store.noteCategoryView(COLLECTION);

  window.InsiderQueue.push({ type: 'user', value: Store.userPayload() });
  window.InsiderQueue.push({ type: 'currency', value: Store.currency() });

  // --- page type: category ----------------------------------------------
  // breadcrumb drives a lot of downstream targeting and must be an array.
  // It mirrors the category path the feed carries into Eureka.
  window.InsiderQueue.push({
    type: 'category',
    value: {
      // Same hierarchy as the catalog's category path: vertical first, so
      // breadcrumb targeting lines up with what Eureka has indexed.
      breadcrumb: (function () {
        var v = (window.VERTICAL && window.VERTICAL.subvertical) || null;
        var path = SUBCAT ? [COLLECTION, SUBCAT] : [COLLECTION];
        return v ? [v].concat(path) : path;
      })(),
      custom: { listing_source: 'eureka-sdk' }
    }
  });

  window.InsiderQueue.push({ type: 'init' });
</script>
</head>

<body>

<p class="announce" data-announce>Free shipping over $50</p>

<header class="masthead">
  <div class="masthead__in">
    <a class="brand" href="index.html" data-brand>Lumen</a>
    <form class="searchbox" data-search role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search-input" name="q" placeholder="Search products" data-search-placeholder aria-label="Search products">
    </form>
    <nav class="utils">
      <span class="loy" data-loyalty-strip hidden></span>
      <a href="flow.html" data-flow-link>Services</a>
      <a href="account.html" data-account-label>Log in</a>
      <a class="cartlink" href="cart.html"><span data-label="cart">Cart</span><span data-cart-count hidden>0</span></a>
    </nav>
  </div>
</header>

<nav class="mainnav">
  <div class="mainnav__in" data-collection-nav></div>
</nav>

<main>

  <div class="wrap">
    <section class="section" style="padding-top:2.5rem">
      <p class="eyebrow">Collection <span class="pagetype">page type: category</span></p>
      <h1 class="h1" id="cat-title"></h1>

      <p class="source" id="listing-source">Eureka · resolving campaign…</p>

      <div class="chips" id="subcats"></div>

      <div class="toolbar">
        <label for="sortby" style="font-size:.8125rem;color:var(--muted)">Sort</label>
        <select id="sortby">
          <option value="Relevancy">Featured</option>
          <option value="PriceAsc">Price, low to high</option>
          <option value="PriceDesc">Price, high to low</option>
          <option value="Newest">Newest</option>
        </select>
        <span id="result-count" style="font-size:.8125rem;color:var(--muted)"></span>
      </div>

      <div class="listing">
        <aside class="facets" id="facets" hidden></aside>
        <div class="listing__main">
          <div class="grid" id="results"></div>
          <div id="pager" style="margin-top:3rem;display:flex;gap:.75rem;justify-content:center"></div>
        </div>
      </div>

<style>
  .listing { display:grid; grid-template-columns: 15rem 1fr; gap:2.5rem; align-items:start }
  /* The shared .grid sets a fixed column count for a full-width page. Inside
     the listing layout the main column is narrower, so let it reflow. */
  .listing__main { min-width:0 }
  .listing .grid { grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)) }
  @media (max-width: 860px) { .listing { grid-template-columns:1fr } .facets { order:-1 } }
  .facets__group { margin-bottom:2rem }
  .facets__title { font-size:.75rem; letter-spacing:.08em; text-transform:uppercase;
                   color:var(--muted); margin:0 0 .75rem }
  .facets__row { display:flex; align-items:center; gap:.5rem; padding:.25rem 0;
                 font-size:.875rem; cursor:pointer }
  .facets__row input { margin:0; cursor:pointer }
  .facets__count { margin-left:auto; color:var(--muted); font-size:.8125rem }
  .facets__clear { font-size:.8125rem; color:var(--muted); background:none; border:0;
                   padding:0; cursor:pointer; text-decoration:underline }
  .card--skeleton { opacity:.5 }
</style>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot__in">
    <span><span data-brand>Lumen</span> — Insider One demo storefront</span>
    <span data-env-label>partnersandbox · 10006846</span>
  </div>
</footer>

<script>

  document.getElementById('cat-title').textContent = SUBCAT || Store.shortName(COLLECTION);
  document.title = Store.shortName(COLLECTION) + ' — Lumen';

  var chips = document.getElementById('subcats');
  var all = document.createElement('a');
  all.className = 'chip';
  all.href = 'category.html?c=' + encodeURIComponent(COLLECTION);
  all.textContent = 'All';
  if (!SUBCAT) all.setAttribute('aria-pressed', 'true');
  chips.appendChild(all);
  // "All" is a filler leaf in the category path (Fashion > Dresses > All), so
  // it arrives as a subcategory and renders a second, identical "All" chip
  // next to the real one. Drop it. Fixing it at source is feed-fixes.md #5.
  Store.subcategories(COLLECTION)
    .filter(function (s) { return !/^all$/i.test(s); })
    .forEach(function (s) {
      var a = document.createElement('a');
      a.className = 'chip';
      a.href = 'category.html?c=' + encodeURIComponent(COLLECTION) + '&sub=' + encodeURIComponent(s);
      a.textContent = s;
      if (s === SUBCAT) a.setAttribute('aria-pressed', 'true');
      chips.appendChild(a);
    });
  // With no real subcategories the lone "All" chip is decoration.
  if (chips.children.length < 2) chips.hidden = true;

  var sourceEl = document.getElementById('listing-source');
  var countEl = document.getElementById('result-count');
  var listing = null;

  /* --- facets -------------------------------------------------------------
     Eureka returns every configured facet on each listing response, as
     `aggregations`, which eureka.js maps to result.facets. Selections go back
     as the `facets` array on the next request, so the sidebar is: draw what
     came back, collect what is ticked, hand it to listing.update().

     Two things worth knowing about the category facet specifically. It comes
     back FLAT — `Beauty` (192), `Makeup` (192), then the leaves — because the
     whole path is indexed rather than a hierarchy. So the vertical and the
     current collection are dropped: both select the entire page and read as
     noise. And the vertical facet eureka.js already applies is not shown,
     because it is scoping rather than a choice the shopper makes.
     ---------------------------------------------------------------------- */
  var selected = {};   // field -> [values]
  var currentTotal = 0;

  function hiddenCategoryValues() {
    var v = (window.Store.catalog[0] && window.Store.catalog[0].taxonomy || [])[0];
    return [v, COLLECTION].filter(Boolean);
  }

  /* The feed writes the whole compound option string into g:color, so Eureka
     indexes "Aqua / AU 10" as one value. The COLOR facet therefore comes back
     as hundreds of entries with a count of 1 each — unusable as a filter.

     Split those values and rebuild them into the two facets they actually
     describe: colours and sizes. Each merged entry remembers the original
     values so ticking it still sends Eureka something it recognises.

     This is a workaround. feed-fixes.md #1 fixes it at source, at which point
     this whole function can go. */
  function splitCompound(facet) {
    var items = facet.items || [];
    var anyCompound = items.some(function (it) {
      return String(it.name).indexOf('/') > -1;
    });
    if (!anyCompound) return [facet];

    var colours = {}, sizes = {};
    items.forEach(function (it) {
      if (!it.documentCount) return;
      String(it.name).split('/').forEach(function (raw) {
        var tok = raw.trim();
        if (!tok) return;
        var bucket = (window.Store.swatchHex && window.Store.swatchHex(tok)) ? colours : sizes;
        var e = bucket[tok] || (bucket[tok] = { name: tok, label: tok, documentCount: 0, values: [] });
        e.documentCount += it.documentCount;
        e.values.push(it.name);
      });
    });

    var out = [];
    function pack(map, name, label) {
      var list = Object.keys(map).map(function (k) { return map[k]; })
        .sort(function (a, b) { return b.documentCount - a.documentCount; });
      if (list.length > 1) out.push({ name: facet.name, label: label, items: list, _split: true });
    }
    pack(colours, facet.name, 'Colour');
    pack(sizes, facet.name, 'Size');
    return out.length ? out : [facet];
  }

  function drawFacets(facets) {
    var host = document.getElementById('facets');
    if (!facets || !facets.length) { host.hidden = true; return; }
    host.innerHTML = '';
    var drew = 0;

    facets = facets.reduce(function (acc, f) {
      return acc.concat(splitCompound(f));
    }, []);

    facets.forEach(function (facet) {
      var items = (facet.items || []).filter(function (it) {
        if (!it.documentCount) return false;
        if (facet.name === 'category' &&
            hiddenCategoryValues().indexOf(it.name) > -1) return false;
        return true;
      });
      if (!items.length) return;

      // A single option that every product already matches is not a filter —
      // it is a label. Happens on category when the collection has one leaf,
      // and on any facet where the whole result set shares a value.
      if (items.length === 1 && items[0].documentCount >= (currentTotal || 0)) return;

      drew++;

      var group = document.createElement('div');
      group.className = 'facets__group';
      var title = document.createElement('p');
      title.className = 'facets__title';
      title.textContent = facet.label || facet.name;
      group.appendChild(title);

      items.slice(0, 10).forEach(function (it) {
        var row = document.createElement('label');
        row.className = 'facets__row';
        var box = document.createElement('input');
        box.type = 'checkbox';
        // A split entry stands for several original values ("Aqua" covers
        // "Aqua / AU 4" through "Aqua / AU 22"), so tick and untick all of them.
        var vals = it.values || [it.name];
        var cur = selected[facet.name] || [];
        box.checked = vals.every(function (v) { return cur.indexOf(v) > -1; });
        box.addEventListener('change', function () {
          var list = selected[facet.name] || [];
          if (box.checked) {
            vals.forEach(function (v) { if (list.indexOf(v) === -1) list = list.concat([v]); });
          } else {
            list = list.filter(function (v) { return vals.indexOf(v) === -1; });
          }
          if (list.length) selected[facet.name] = list; else delete selected[facet.name];
          applyFacets();
        });
        var name = document.createElement('span');
        name.textContent = it.label || it.name;
        var count = document.createElement('span');
        count.className = 'facets__count';
        count.textContent = it.documentCount;
        row.appendChild(box); row.appendChild(name); row.appendChild(count);
        group.appendChild(row);
      });
      host.appendChild(group);
    });

    if (Object.keys(selected).length) {
      var clear = document.createElement('button');
      clear.type = 'button';
      clear.className = 'facets__clear';
      clear.textContent = 'Clear all filters';
      clear.addEventListener('click', function () { selected = {}; applyFacets(); });
      host.appendChild(clear);
    }

    host.hidden = drew === 0;
  }

  function applyFacets() {
    var list = Object.keys(selected).map(function (field) {
      return { field: field, values: selected[field] };
    });
    // Always back to page 1: a filtered set rarely has the page you were on.
    listing.update({ facets: list, page: 1 });

    window.InsiderQueue.push({
      type: 'custom_event',
      value: [{ event_name: 'filter_applied',
                event_parameters: { custom: {
                  filter_name: 'facets',
                  filter_value: list.map(function (f) {
                    return f.field + ':' + f.values.join('|');
                  }).join(', ') || 'cleared'
                } } }]
    });
  }

  function paint(products, opts) {
    opts = opts || {};
    Store.grid('#results', products, {
      onClick: function (ev) {
        var cards = Array.prototype.slice.call(document.querySelectorAll('#results .card'));
        var pos = cards.indexOf(ev.currentTarget.closest('.card')) + 1;
        if (listing && opts.live) listing.clickProduct(products[pos - 1], pos);
      }
    });
    countEl.textContent = (opts.total != null ? opts.total : products.length) + ' products';
  }

  function renderFallback() {
    var local = Store.byCollection(COLLECTION, SUBCAT);
    sourceEl.className = 'source is-fallback';
    sourceEl.textContent = 'Local catalogue · Eureka not serving this page';
    paint(local, { live: false });
    return local;
  }

  // Placeholder cards while the tag loads and the campaign resolves. Painting
  // the local catalogue here instead would show one ordering and then replace
  // it with Eureka's a moment later — a visible flash on every category page.
  // Eureka is the source of truth for this grid; the local catalogue is only
  // the failure path, in renderFallback().
  function paintSkeleton(n) {
    var grid = document.querySelector('#results');
    if (!grid) return;
    grid.innerHTML = '';
    for (var i = 0; i < (n || 8); i++) {
      var card = document.createElement('article');
      card.className = 'card card--skeleton';
      card.setAttribute('aria-hidden', 'true');
      card.innerHTML =
        '<div class="card__media" style="background:var(--alt)"></div>' +
        '<div class="card__meta">' +
          '<p style="height:.7rem;width:40%;background:var(--alt);border-radius:2px"></p>' +
          '<p style="height:.9rem;width:75%;background:var(--alt);border-radius:2px;margin-top:.4rem"></p>' +
          '<p style="height:.8rem;width:30%;background:var(--alt);border-radius:2px;margin-top:.6rem"></p>' +
        '</div>';
      grid.appendChild(card);
    }
  }

  if (window.Eureka && window.Eureka.enabled) {
    paintSkeleton(8);

    listing = window.Eureka.listing({
      category: SUBCAT || COLLECTION,
      onRender: function (result, state) {
        sourceEl.className = 'source is-live';
        sourceEl.textContent = 'Eureka campaign ' + state.campId + ' · ' +
                               ((window.ENVIRONMENT && window.ENVIRONMENT.account) || '?') +
                               ' catalogue · sort: ' + state.sorting;
        paint(result.items, { live: true, total: result.navigation.total });
        currentTotal = result.navigation.total || result.items.length;
        drawFacets(result.facets);
        drawPager(result.navigation, state);
      },
      onFallback: renderFallback
    });

    document.getElementById('sortby').addEventListener('change', function (ev) {
      // Every sort change must re-fetch AND re-track.
      listing.update({ sorting: ev.target.value, page: 1 });
      window.InsiderQueue.push({
        type: 'custom_event',
        value: [{ event_name: 'filter_applied',
                  event_parameters: { custom: { filter_name: 'sort', filter_value: ev.target.value } } }]
      });
    });
  } else {
    renderFallback();
  }

  function drawPager(navigation, state) {
    var pager = document.getElementById('pager');
    pager.innerHTML = '';
    var total = navigation.totalPageCount || 1;
    if (total < 2) return;
    for (var i = 1; i <= Math.min(total, 8); i++) {
      (function (n) {
        var b = document.createElement('button');
        b.className = 'btn btn--ghost';
        b.style.padding = '.55rem 1rem';
        b.textContent = n;
        if (n === state.page) b.disabled = true;
        b.addEventListener('click', function () { listing.update({ page: n }); });
        pager.appendChild(b);
      })(i);
    }
  }
</script>
</body>
</html>
