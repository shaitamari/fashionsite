<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — Lumen</title>

<!-- Browsers largely ignore these; the real protection is the Cache-Control
     headers in _headers / netlify.toml / vercel.json. Kept as a second line. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="assets/styles.css">

<!-- ══════════════════════════════════════════════════════════════════════════
     INSIDER WEB SDK
     Order is load-bearing:
       1. InsiderQueue array
       2. site scripts (telemetry wrapper must precede the first push)
       3. Insider Tag (ins.js)
       4. user data -> page data -> init
     ═══════════════════════════════════════════════════════════════════════ -->

<!-- 1. The queue. Must exist before the tag loads. -->
<script>window.InsiderQueue = window.InsiderQueue || [];</script>

<!-- 2. Site scripts. insider-debug.js wraps InsiderQueue.push to mirror every
        payload into the on-page console, so it loads before anything is sent. -->
<script src="assets/config.js"></script>
<script src="assets/insider-debug.js"></script>
<script src="assets/vertical.js"></script>
<script src="assets/store.js"></script>

<!-- 3. Insider Tag — account: onesandbox (10014057) -->
<script async src="//onesandbox.api.useinsider.com/ins.js?id=10014057"></script>

<!-- 4. Data pushes for this page. -->
<script src="assets/reco.js"></script>
<script>
  var PID = new URLSearchParams(location.search).get('id');
  var PRODUCT = Store.byId(PID) || Store.catalog[0];

  Store.noteCategoryView(PRODUCT.collection);

  window.InsiderQueue.push({ type: 'user', value: Store.userPayload() });
  window.InsiderQueue.push({ type: 'currency', value: 'USD' });

  // --- page type: product -----------------------------------------------
  // One product per page. `id` is the Shopify VARIANT id and `groupcode` is
  // the product id — the same shape the live Posh site sends, so both sites
  // write consistent records into the shared salesdemo catalogue.
  window.InsiderQueue.push({ type: 'product', value: Store.productPayload(PRODUCT) });

  window.InsiderQueue.push({ type: 'init' });
</script>
</head>

<body>

<p class="announce" data-announce>Free shipping over $50</p>

<header class="masthead">
  <div class="masthead__in">
    <a class="brand" href="index.html" data-brand>Lumen</a>
    <form class="searchbox" data-search role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search-input" name="q" placeholder="Search products" data-search-placeholder aria-label="Search products">
    </form>
    <nav class="utils">
      <a href="account.html" data-account-label>Log in</a>
      <a class="cartlink" href="cart.html"><span data-label="cart">Cart</span><span data-cart-count hidden>0</span></a>
    </nav>
  </div>
</header>

<nav class="mainnav">
  <div class="mainnav__in" data-collection-nav></div>
</nav>

<main>

  <div class="wrap">
    <section class="pdp">
      <div class="pdp__gallery">
        <div class="pdp__main"><img id="p-img" alt=""></div>
        <div class="pdp__thumbs" id="p-thumbs"></div>
      </div>

      <div>
        <p class="pdp__vendor" id="p-vendor"></p>
        <p class="eyebrow" style="margin-bottom:.75rem"><span id="p-crumb"></span> <span class="pagetype">page type: product</span></p>
        <h1 class="h1" style="font-size:clamp(1.5rem,3vw,2.25rem)" id="p-name"></h1>
        <p class="pdp__price" id="p-price"></p>
        <p class="lede" id="p-desc" style="margin-bottom:2rem;font-size:.9375rem"></p>

        <div id="variant-block" hidden>
          <p class="eyebrow" style="margin-bottom:.6rem"><span id="variant-label"></span></p>
          <div class="sizes" id="p-variants"></div>
        </div>

        <div class="qtyrow">
          <div class="qty">
            <button type="button" id="q-dec">&minus;</button>
            <span id="q-val">1</span>
            <button type="button" id="q-inc">+</button>
          </div>
          <span style="font-size:.8125rem;color:var(--muted)" id="p-stockline"></span>
        </div>

        <button class="btn btn--wide" id="add-btn" data-label="add_to_cart">Add to cart</button>

        <div style="display:flex;gap:1.5rem;margin-top:1.25rem">
          <button class="linkish" id="wish-btn">Save for later</button>
          <button class="linkish" id="size-btn">Size &amp; fit</button>
        </div>

        <p class="source" id="pdp-msg" style="margin-top:1.5rem" hidden></p>

        <div class="spec">
          <dl>
            <dt>Variant ID</dt><dd id="p-id"></dd>
            <dt>Product ID</dt><dd id="p-group"></dd>
            <dt>Variant</dt><dd id="p-sku"></dd>
            <dt>Category</dt><dd id="p-vend2"></dd>
            <dt>Collection</dt><dd id="p-type"></dd>
          </dl>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section__head">
        <h2 class="h2">You may also like</h2>
        <span class="source" id="reco-product-note">Smart Recommender · waiting for campaign</span>
      </div>
      <div id="reco-product" hidden></div>
    </section>

    <section class="section">
      <div class="section__head"><h2 class="h2">More from this category</h2></div>
      <div class="grid" id="related"></div>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot__in">
    <span><span data-brand>Lumen</span> — Insider One demo storefront</span>
    <span>onesandbox · 10014057</span>
  </div>
</footer>

<script>

  function watchReco(key) {
    var box = document.getElementById('reco-' + key);
    var note = document.getElementById('reco-' + key + '-note');
    if (!box || !note) return;
    new MutationObserver(function () {
      if (!box.hidden && box.children.length) {
        note.className = 'source is-live';
        note.textContent = 'Smart Recommender · live from salesdemo';
      }
    }).observe(box, { childList: true, attributes: true });
  }

  document.title = PRODUCT.name + ' — Lumen';
  document.getElementById('p-img').src = PRODUCT.image;
  document.getElementById('p-name').textContent = PRODUCT.name;
  document.getElementById('p-vendor').textContent = PRODUCT.subcategory || '';
  document.getElementById('p-desc').textContent = PRODUCT.description || '';
  document.getElementById('p-id').textContent = PRODUCT.id;
  document.getElementById('p-group').textContent = PRODUCT.groupcode;
  document.getElementById('p-sku').textContent = PRODUCT.variant_label || '—';
  document.getElementById('p-vend2').textContent = PRODUCT.subcategory || '—';
  document.getElementById('p-type').textContent = PRODUCT.collection || '—';
  document.getElementById('p-stockline').textContent =
    PRODUCT.in_stock ? 'In stock' : 'Out of stock';

  var crumb = document.getElementById('p-crumb');
  crumb.innerHTML = '<a href="category.html?c=' + encodeURIComponent(PRODUCT.collection) +
                    '" style="color:inherit">' + PRODUCT.collection + '</a>';

  var priceEl = document.getElementById('p-price');
  if (PRODUCT.unit_sale_price < PRODUCT.unit_price) {
    priceEl.innerHTML = '<s class="was">' + Store.money(PRODUCT.unit_price) +
                        '</s><span class="now">' + Store.money(PRODUCT.unit_sale_price) + '</span>';
  } else {
    priceEl.textContent = Store.money(PRODUCT.unit_price);
  }

  var thumbs = document.getElementById('p-thumbs');
  (PRODUCT.images || [PRODUCT.image]).forEach(function (src, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(i === 0));
    b.innerHTML = '<img alt="" src="' + src + '">';
    b.addEventListener('click', function () {
      document.getElementById('p-img').src = src;
      thumbs.querySelectorAll('button').forEach(function (n) {
        n.setAttribute('aria-pressed', String(n === b));
      });
    });
    thumbs.appendChild(b);
  });
  if (thumbs.children.length < 2) thumbs.hidden = true;

  // Sibling variants share a groupcode. Switching shade is a NAVIGATION, not
  // an attribute change, because each variant is its own catalog record and
  // needs its own product view pushed.
  var siblings = Store.catalog.filter(function (x) {
    return x.groupcode === PRODUCT.groupcode && x.variant_label;
  });
  if (siblings.length > 1) {
    document.getElementById('variant-block').hidden = false;
    document.getElementById('variant-label').textContent = PRODUCT.option_name || 'Shade';
    var host = document.getElementById('p-variants');
    siblings.forEach(function (sib) {
      var b = document.createElement('button');
      b.className = 'shade';
      b.type = 'button';
      b.textContent = sib.variant_label;
      b.setAttribute('aria-pressed', String(sib.id === PRODUCT.id));
      b.addEventListener('click', function () {
        if (sib.id !== PRODUCT.id) location.href = Store.localHref(sib);
      });
      host.appendChild(b);
    });
  }

  var qty = 1;
  var qval = document.getElementById('q-val');
  document.getElementById('q-inc').addEventListener('click', function () {
    qty++; qval.textContent = qty;
  });
  document.getElementById('q-dec').addEventListener('click', function () {
    if (qty > 1) { qty--; qval.textContent = qty; }
  });

  var msg = document.getElementById('pdp-msg');
  function say(text, cls) {
    msg.hidden = false;
    msg.className = 'source ' + (cls || 'is-live');
    msg.textContent = text;
  }

  document.getElementById('add-btn').addEventListener('click', function () {
    var payload = Store.addToCart(PRODUCT.id, qty);
    // add_to_cart does NOT need an init afterwards.
    window.InsiderQueue.push({ type: 'add_to_cart', value: payload });
    say('add_to_cart sent · variant ' + PRODUCT.id + ' ×' + qty);
  });

  var wishBtn = document.getElementById('wish-btn');
  function paintWish() { wishBtn.textContent = Store.isWished(PRODUCT.id) ? 'Saved' : 'Save for later'; }
  paintWish();
  wishBtn.addEventListener('click', function () {
    var added = Store.toggleWish(PRODUCT.id);
    paintWish();
    if (!added) return;
    window.InsiderQueue.push({
      type: 'custom_event',
      value: [{ event_name: 'product_wishlisted',
                event_parameters: { custom: { product_id: PRODUCT.id, product_name: PRODUCT.name } } }]
    });
    say('custom_event product_wishlisted sent');
  });

  document.getElementById('size-btn').addEventListener('click', function () {
    window.InsiderQueue.push({
      type: 'custom_event',
      value: [{ event_name: 'size_guide_opened',
                event_parameters: { custom: { product_id: PRODUCT.id } } }]
    });
    say('custom_event size_guide_opened sent');
  });

  var seen = {};
  Store.grid('#related', Store.byCollection(PRODUCT.collection).filter(function (p) {
    if (p.groupcode === PRODUCT.groupcode || seen[p.groupcode]) return false;
    seen[p.groupcode] = true;
    return true;
  }).slice(0, 6));

  watchReco('product');
</script>
</body>
</html>
