<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Posh Street</title>

<!-- Browsers largely ignore these; the real protection is the Cache-Control
     headers in _headers / netlify.toml / vercel.json. Kept as a second line. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="assets/styles.css">

<!-- ══════════════════════════════════════════════════════════════════════════
     INSIDER WEB SDK
     Order is load-bearing:
       1. InsiderQueue array
       2. site scripts (telemetry wrapper must precede the first push)
       3. Insider Tag (ins.js)
       4. user data -> page data -> init
     ═══════════════════════════════════════════════════════════════════════ -->

<!-- 1. The queue. Must exist before the tag loads. -->
<script>window.InsiderQueue = window.InsiderQueue || [];</script>

<!-- 2. Site scripts. insider-debug.js wraps InsiderQueue.push to mirror every
        payload into the on-page console, so it loads before anything is sent. -->
<script src="assets/config.js"></script>
<script src="assets/insider-debug.js"></script>
<script src="assets/catalog.js"></script>
<script src="assets/store.js"></script>

<!-- 3. Insider Tag — account: onesandbox (10014057) -->
<script async src="//onesandbox.api.useinsider.com/ins.js?id=10014057"></script>

<!-- 4. Data pushes for this page. -->
<script src="assets/eureka.js"></script>
<script>
  var QUERY = (new URLSearchParams(location.search).get('q') || '').trim();

  window.InsiderQueue.push({ type: 'user', value: Store.userPayload() });
  window.InsiderQueue.push({ type: 'currency', value: 'USD' });

  // --- page type: other -------------------------------------------------
  // Search results are not one of the commerce page types, so they are
  // labelled "other" with a name that surfaces on the user profile.
  window.InsiderQueue.push({
    type: 'other',
    value: { name: 'search results',
             custom: { search_term: QUERY, results_source: 'eureka-sdk' } }
  });

  window.InsiderQueue.push({ type: 'init' });

  // --- custom event: site_search ----------------------------------------
  // Event methods do not need an init afterwards. This first push records
  // intent; results_count is restated once Eureka answers.
  if (QUERY) {
    window.InsiderQueue.push({
      type: 'custom_event',
      value: [{ event_name: 'site_search',
                event_parameters: { custom: { search_term: QUERY, results_count: 0 } } }]
    });
  }
</script>
</head>

<body>

<p class="announce">Free shipping on orders over $150 &nbsp;·&nbsp; 30-day returns</p>

<header class="masthead">
  <div class="masthead__in">
    <a class="brand" href="index.html">Posh Street</a>
    <form class="searchbox" data-search role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search-input" name="q" placeholder="Search products" aria-label="Search products">
    </form>
    <nav class="utils">
      <a href="account.html" data-account-label>Log in</a>
      <a class="cartlink" href="cart.html">Cart<span data-cart-count hidden>0</span></a>
    </nav>
  </div>
</header>

<nav class="mainnav">
  <div class="mainnav__in" data-collection-nav></div>
</nav>

<main>

  <div class="wrap">
    <section class="section" style="padding-top:2.5rem">
      <p class="eyebrow">Search <span class="pagetype">page type: other · "search results"</span></p>
      <h1 class="h1" id="q-title"></h1>

      <p class="source" id="search-source">Eureka · resolving campaign…</p>

      <div class="toolbar">
        <label for="sortby" style="font-size:.8125rem;color:var(--muted)">Sort</label>
        <select id="sortby">
          <option value="Relevancy">Relevance</option>
          <option value="PriceAsc">Price, low to high</option>
          <option value="PriceDesc">Price, high to low</option>
        </select>
        <span id="result-count" style="font-size:.8125rem;color:var(--muted)"></span>
      </div>

      <div class="grid" id="results"></div>

      <div class="empty" id="empty" hidden>
        <h2 class="h2">No results</h2>
        <p>Try a broader term, or browse the <a href="category.html?c=Shoes%20Collection">footwear collection</a>.</p>
      </div>

      <div id="pager" style="margin-top:3rem;display:flex;gap:.75rem;justify-content:center"></div>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot__in">
    <span>Posh Street — Insider One demo storefront</span>
    <span>onesandbox · 10014057</span>
  </div>
</footer>

<script>

  document.getElementById('q-title').textContent = QUERY ? '\u201c' + QUERY + '\u201d' : 'Search';
  document.title = (QUERY || 'Search') + ' — Posh Street';
  var input = document.getElementById('search-input');
  if (input) input.value = QUERY;

  var sourceEl = document.getElementById('search-source');
  var countEl = document.getElementById('result-count');
  var emptyEl = document.getElementById('empty');
  var search = null;

  function paint(products, opts) {
    opts = opts || {};
    emptyEl.hidden = products.length > 0;
    Store.grid('#results', products, {
      onClick: function (ev) {
        var cards = Array.prototype.slice.call(document.querySelectorAll('#results .card'));
        var pos = cards.indexOf(ev.currentTarget.closest('.card')) + 1;
        if (search && opts.live) search.clickProduct(products[pos - 1], pos);
      }
    });
    countEl.textContent = (opts.total != null ? opts.total : products.length) + ' results';
  }

  function renderFallback() {
    var local = Store.localSearch(QUERY);
    sourceEl.className = 'source is-fallback';
    sourceEl.textContent = 'Local catalogue · Eureka not serving this page';
    paint(local, { live: false });
    return local;
  }

  if (QUERY && window.Eureka && window.Eureka.enabled) {
    paint(Store.localSearch(QUERY), { live: false });

    search = window.Eureka.search({
      query: QUERY,
      onRender: function (result, state) {
        sourceEl.className = 'source is-live';
        sourceEl.textContent = 'Eureka campaign ' + state.campId +
                               ' · onesandbox catalogue · sort: ' + state.sorting;
        paint(result.items, { live: true, total: state.total });
        drawPager(result.navigation, state);

        // Restate the custom event now the real count is known.
        window.InsiderQueue.push({
          type: 'custom_event',
          value: [{ event_name: 'site_search',
                    event_parameters: { custom: { search_term: QUERY, results_count: state.total } } }]
        });
      },
      onFallback: renderFallback
    });

    document.getElementById('sortby').addEventListener('change', function (ev) {
      search.update({ sorting: ev.target.value, page: 1 });
    });
  } else {
    renderFallback();
  }

  function drawPager(navigation, state) {
    var pager = document.getElementById('pager');
    pager.innerHTML = '';
    var total = navigation.totalPageCount || 1;
    if (total < 2) return;
    for (var i = 1; i <= Math.min(total, 8); i++) {
      (function (n) {
        var b = document.createElement('button');
        b.className = 'btn btn--ghost';
        b.style.padding = '.55rem 1rem';
        b.textContent = n;
        if (n === state.page) b.disabled = true;
        b.addEventListener('click', function () { search.update({ page: n }); });
        pager.appendChild(b);
      })(i);
    }
  }
</script>
</body>
</html>
