<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Lumen</title>

<!-- Browsers largely ignore these; the real protection is the Cache-Control
     headers in _headers / netlify.toml / vercel.json. Kept as a second line. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="assets/styles.css">

<!-- ══════════════════════════════════════════════════════════════════════════
     INSIDER WEB SDK
     Order is load-bearing:
       1. InsiderQueue array
       2. site scripts (telemetry wrapper must precede the first push)
       3. Insider Tag (ins.js)
       4. user data -> page data -> init
     ═══════════════════════════════════════════════════════════════════════ -->

<!-- 1. The queue. Must exist before the tag loads. -->
<script>window.InsiderQueue = window.InsiderQueue || [];</script>

<!-- 2. Site scripts. insider-debug.js wraps InsiderQueue.push to mirror every
        payload into the on-page console, so it loads before anything is sent. -->
<script src="assets/config.js"></script>
<script src="assets/insider-debug.js"></script>
<script src="assets/vertical.js"></script>
<script src="assets/store.js"></script>
<script src="assets/explain.js"></script>

<!-- 3. Insider Tag — written by assets/vertical.js, because which
        account it points at depends on the hostname:
          beauty.insiderdemo.com          -> salesdemo
          beauty-sandbox.insiderdemo.com  -> partnersandbox
        Account and partner id are listed in vertical.js and shown
        live in the SDK console. -->

<!-- 4. Data pushes for this page. -->
<script src="assets/eureka.js"></script>
<script>
  var QUERY = (new URLSearchParams(location.search).get('q') || '').trim();

  window.InsiderQueue.push({ type: 'user', value: Store.userPayload() });
  window.InsiderQueue.push({ type: 'currency', value: Store.currency() });

  // --- page type: other -------------------------------------------------
  // Search results are not one of the commerce page types, so they are
  // labelled "other" with a name that surfaces on the user profile.
  window.InsiderQueue.push({
    type: 'other',
    value: { name: 'search results',
             custom: { search_term: QUERY, results_source: 'eureka-sdk' } }
  });

  window.InsiderQueue.push({ type: 'init' });

  // --- custom event: site_search ----------------------------------------
  // Event methods do not need an init afterwards. This first push records
  // intent; results_count is restated once Eureka answers.
  if (QUERY) {
    window.InsiderQueue.push({
      type: 'custom_event',
      value: [{ event_name: 'site_search',
                event_parameters: { custom: { search_term: QUERY, results_count: 0 } } }]
    });
  }
</script>
</head>

<body>

<p class="announce" data-announce>Free shipping over $50</p>

<header class="masthead">
  <div class="masthead__in">
    <a class="brand" href="index.html" data-brand>Lumen</a>
    <form class="searchbox" data-search role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search-input" name="q" placeholder="Search products" data-search-placeholder aria-label="Search products">
    </form>
    <nav class="utils">
      <a href="account.html" data-account-label>Log in</a>
      <a class="cartlink" href="cart.html"><span data-label="cart">Cart</span><span data-cart-count hidden>0</span></a>
    </nav>
  </div>
</header>

<nav class="mainnav">
  <div class="mainnav__in" data-collection-nav></div>
</nav>

<main>

  <div class="wrap">
    <section class="section" style="padding-top:2.5rem">
      <p class="eyebrow">Search <span class="pagetype">page type: other · "search results"</span></p>
      <h1 class="h1" id="q-title"></h1>

      <p class="source" id="search-source">Eureka · resolving campaign…</p>

      <!-- Shown when the query matched nothing and the products below are
           substitutes rather than results. Styled inline so it does not
           depend on a class existing in styles.css. -->
      <div id="search-notice" hidden
           style="margin:1.5rem 0 0;padding:1rem 1.25rem;border:1px solid var(--line,#e5e5e5);
                  border-radius:.5rem;background:var(--surface,#fafafa)">
        <strong id="search-notice-title" style="display:block;font-size:.9375rem;margin-bottom:.25rem"></strong>
        <span id="search-notice-body" style="font-size:.875rem;color:var(--muted,#666)"></span>
      </div>

      <div class="toolbar">
        <label for="sortby" style="font-size:.8125rem;color:var(--muted)">Sort</label>
        <select id="sortby">
          <option value="Relevancy">Relevance</option>
          <option value="PriceAsc">Price, low to high</option>
          <option value="PriceDesc">Price, high to low</option>
        </select>
        <span id="result-count" style="font-size:.8125rem;color:var(--muted)"></span>
      </div>

      <div class="grid" id="results"></div>

      <div class="empty" id="empty" hidden>
        <h2 class="h2">No results</h2>
        <p>Try a broader term, or browse the <a href="category.html?c=Makeup">makeup collection</a>.</p>
      </div>

      <div id="pager" style="margin-top:3rem;display:flex;gap:.75rem;justify-content:center"></div>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot__in">
    <span><span data-brand>Lumen</span> — Insider One demo storefront</span>
    <span id="foot-account">—</span>
  </div>
</footer>

<script>

  document.getElementById('q-title').textContent = QUERY ? '\u201c' + QUERY + '\u201d' : 'Search';
  document.title = (QUERY || 'Search') + ' — Lumen';
  var input = document.getElementById('search-input');
  if (input) input.value = QUERY;

  var sourceEl = document.getElementById('search-source');
  var countEl = document.getElementById('result-count');
  var emptyEl = document.getElementById('empty');
  var noticeEl = document.getElementById('search-notice');
  var noticeTitleEl = document.getElementById('search-notice-title');
  var noticeBodyEl = document.getElementById('search-notice-body');
  var search = null;

  // Footer shows the account this hostname actually resolved to, rather than
  // a hard-coded one that goes stale when the estate moves accounts.
  (function () {
    var env = window.ENVIRONMENT || {};
    var foot = document.getElementById('foot-account');
    if (foot && env.account) foot.textContent = env.account + ' · ' + (env.partnerId || '');
  })();

  /* --- the no-results notice ---------------------------------------------
     Shown whenever the products on screen are substitutes rather than
     matches. Being explicit is better than silently swapping in other
     products: a visitor who searched "sofa" and sees lipsticks with no
     explanation assumes the search is broken.
     ---------------------------------------------------------------------- */
  function showNotice(title, body) {
    noticeTitleEl.textContent = title;
    noticeBodyEl.textContent = body || '';
    noticeEl.hidden = false;
  }

  function hideNotice() { noticeEl.hidden = true; }

  function noResultsTitle() {
    return QUERY ? 'No results for \u201c' + QUERY + '\u201d' : 'No results';
  }

  /* Suggestions of last resort — used when the query matched nothing in
     Eureka AND nothing in the local catalogue, so there is genuinely
     nothing relevant to show. In-stock items from this vertical only,
     because Store.catalog is already scoped to the hostname's vertical. */
  function suggestions(n) {
    var cat = (window.Store && window.Store.catalog) || [];
    var live = cat.filter(function (p) { return p.in_stock !== 0; });
    // Collapse variants, or an airline shows the same route four times, once
    // per cabin. Every other listing on the site goes through this.
    return Store.oneVariantEach(live).slice(0, n || 8);
  }

  function paint(products, opts) {
    opts = opts || {};
    emptyEl.hidden = products.length > 0;
    Store.grid('#results', products, {
      onClick: function (ev) {
        var cards = Array.prototype.slice.call(document.querySelectorAll('#results .card'));
        var pos = cards.indexOf(ev.currentTarget.closest('.card')) + 1;
        if (search && opts.live) search.clickProduct(products[pos - 1], pos);
      }
    });
    countEl.textContent = (opts.total != null ? opts.total : products.length) + ' results';
  }

  /* Called by eureka.js whenever it cannot serve real results: no campaign,
     a fetch error, or a fallback whose substitutes were all from other
     verticals. Renders the site's own catalogue instead. */
  function renderFallback() {
    var local = Store.localSearch(QUERY);
    sourceEl.className = 'source is-fallback';
    sourceEl.textContent = 'Local catalogue · Eureka not serving this page';

    if (local.length) {
      hideNotice();
      paint(local, { live: false });
      return local;
    }

    // Nothing matched locally either. Show suggestions rather than a bare
    // empty state, and say plainly that they are suggestions.
    var picks = suggestions(8);
    if (picks.length) {
      showNotice(noResultsTitle(), 'Nothing matched your search. You might be interested in these instead.');
      paint(picks, { live: false, total: picks.length });
      countEl.textContent = picks.length + ' suggestions';
    } else {
      showNotice(noResultsTitle(), 'Try a broader term.');
      paint([], { live: false });
    }
    return [];
  }

  if (QUERY && window.Eureka && window.Eureka.enabled) {
    paint(Store.localSearch(QUERY), { live: false });

    search = window.Eureka.search({
      query: QUERY,
      onRender: function (result, state) {
        var env = window.ENVIRONMENT || {};
        sourceEl.className = 'source is-live';
        sourceEl.textContent = 'Eureka campaign ' + state.campId +
                               ' · ' + (env.account || 'catalogue') +
                               ' · sort: ' + state.sorting;

        // result.fallback is set by eureka.js when Eureka matched nothing and
        // returned substitutes. Those have already been scoped to this
        // vertical — but they are still not results, so say so.
        if (result.fallback) {
          showNotice(noResultsTitle(),
                     'Nothing matched your search. You might be interested in these instead.');
        } else {
          hideNotice();
        }

        paint(result.items, { live: true, total: state.total });
        if (result.fallback) countEl.textContent = result.items.length + ' suggestions';
        drawPager(result.navigation, state);

        // Restate the custom event now the real count is known. A fallback
        // matched nothing, so the honest count is zero — recording the
        // substitute count would make zero-result searches invisible in the
        // panel, which is exactly the report worth having.
        window.InsiderQueue.push({
          type: 'custom_event',
          value: [{ event_name: 'site_search',
                    event_parameters: { custom: {
                      search_term: QUERY,
                      results_count: result.fallback ? 0 : state.total
                    } } }]
        });
      },
      onFallback: renderFallback
    });

    document.getElementById('sortby').addEventListener('change', function (ev) {
      search.update({ sorting: ev.target.value, page: 1 });
    });
  } else {
    renderFallback();
  }

  function drawPager(navigation, state) {
    var pager = document.getElementById('pager');
    pager.innerHTML = '';
    var total = navigation.totalPageCount || 1;
    if (total < 2) return;
    for (var i = 1; i <= Math.min(total, 8); i++) {
      (function (n) {
        var b = document.createElement('button');
        b.className = 'btn btn--ghost';
        b.style.padding = '.55rem 1rem';
        b.textContent = n;
        if (n === state.page) b.disabled = true;
        b.addEventListener('click', function () { search.update({ page: n }); });
        pager.appendChild(b);
      })(i);
    }
  }
</script>
</body>
</html>
