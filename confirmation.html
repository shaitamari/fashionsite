<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order confirmed — Lumen</title>

<!-- Browsers largely ignore these; the real protection is the Cache-Control
     headers in _headers / netlify.toml / vercel.json. Kept as a second line. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="assets/styles.css">

<!-- ══════════════════════════════════════════════════════════════════════════
     INSIDER WEB SDK
     Order is load-bearing:
       1. InsiderQueue array
       2. site scripts (telemetry wrapper must precede the first push)
       3. Insider Tag (ins.js)
       4. user data -> page data -> init
     ═══════════════════════════════════════════════════════════════════════ -->

<!-- 1. The queue. Must exist before the tag loads. -->
<script>window.InsiderQueue = window.InsiderQueue || [];</script>

<!-- 2. Site scripts. insider-debug.js wraps InsiderQueue.push to mirror every
        payload into the on-page console, so it loads before anything is sent. -->
<script src="assets/config.js"></script>
<script src="assets/insider-debug.js"></script>
<script src="assets/vertical.js"></script>
<script src="assets/store.js"></script>
<script src="assets/explain.js"></script>

<!-- 3. Insider Tag — written by assets/vertical.js, because which
        account it points at depends on the hostname:
          beauty.insiderdemo.com          -> salesdemo
          beauty-sandbox.insiderdemo.com  -> partnersandbox
        Account and partner id are listed in vertical.js and shown
        live in the SDK console. -->

<!-- 4. Data pushes for this page. -->
<script src="assets/reco.js"></script>
<script>
  var ORDER = null;
  try { ORDER = JSON.parse(localStorage.getItem('lmn.order') || 'null'); } catch (e) {}

  window.InsiderQueue.push({ type: 'user', value: Store.userPayload() });
  window.InsiderQueue.push({ type: 'currency', value: Store.currency() });

  if (ORDER) {
    // --- page type: purchase --------------------------------------------
    // Sends the Purchase (confirmation_page_view) event — the single most
    // important push for revenue attribution and conversion measurement.
    window.InsiderQueue.push({
      type: 'purchase',
      value: {
        order_id: ORDER.order_id,
        total: ORDER.total,
        shipping_cost: ORDER.shipping_cost,
        items: ORDER.items
      }
    });
  } else {
    window.InsiderQueue.push({
      type: 'other', value: { name: 'order confirmation (no order found)' }
    });
  }

  window.InsiderQueue.push({ type: 'init' });

  // The purchase payload is queued, so the cart can be emptied safely.
  if (ORDER) Store.clearCart();
</script>
</head>

<body>

<p class="announce" data-announce>Free shipping over $50</p>

<header class="masthead">
  <div class="masthead__in">
    <a class="brand" href="index.html" data-brand>Lumen</a>
    <form class="searchbox" data-search role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search-input" name="q" placeholder="Search products" data-search-placeholder aria-label="Search products">
    </form>
    <nav class="utils">
      <a href="account.html" data-account-label>Log in</a>
      <a class="cartlink" href="cart.html"><span data-label="cart">Cart</span><span data-cart-count hidden>0</span></a>
    </nav>
  </div>
</header>

<nav class="mainnav">
  <div class="mainnav__in" data-collection-nav></div>
</nav>

<main>

  <div class="wrap">
    <section class="section" style="padding-top:4rem">
      <p class="eyebrow">Confirmed <span class="pagetype">page type: purchase</span></p>
      <h1 class="h1" data-label="confirm_title">Thank you for your order.</h1>
      <p class="lede" id="conf-line"></p>
    </section>

    <section class="section" style="padding-top:2rem">
      <div class="panel" style="max-width:660px">
        <p class="eyebrow">What was sent</p>
        <div class="totals" id="order-summary"></div>
      </div>
    </section>

    <section class="section">
      <div class="section__head">
        <h2 class="h2">You may also like</h2>
        <span class="source" id="reco-confirmation-note">Smart Recommender · waiting for campaign</span>
      </div>
      <div id="reco-confirmation" hidden></div>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot__in">
    <span><span data-brand>Lumen</span> — Insider One demo storefront</span>
    <span>onesandbox · 10014057</span>
  </div>
</footer>

<script>

  function watchReco(key) {
    var box = document.getElementById('reco-' + key);
    var note = document.getElementById('reco-' + key + '-note');
    if (!box || !note) return;
    new MutationObserver(function () {
      if (!box.hidden && box.children.length) {
        note.className = 'source is-live';
        note.textContent = 'Smart Recommender · live from salesdemo';
      }
    }).observe(box, { childList: true, attributes: true });
  }

  var line = document.getElementById('conf-line');
  var summary = document.getElementById('order-summary');

  if (!ORDER) {
    line.textContent = 'No order found in this browser. Add something to the cart and check out to see a purchase event.';
    summary.innerHTML = '<div><span>Status</span><span>no order</span></div>';
  } else {
    line.textContent = 'Order ' + ORDER.order_id + ' is confirmed. A receipt is on its way.';
    summary.innerHTML =
      ORDER.items.map(function (i) {
        return '<div><span>' + i.quantity + '\u00d7 ' + i.name + ' (' + i.id + ')</span>' +
               '<span>' + Store.money(i.unit_sale_price * i.quantity) + '</span></div>';
      }).join('') +
      '<div><span>Shipping</span><span>' +
        (ORDER.shipping_cost ? Store.money(ORDER.shipping_cost) : 'Free') + '</span></div>' +
      '<div class="grand"><span>Order total</span><span>' + Store.money(ORDER.total) + '</span></div>';

    // Stop a refresh from firing a duplicate purchase event.
    localStorage.removeItem('lmn.order');
  }

  watchReco('confirmation');
</script>
</body>
</html>
